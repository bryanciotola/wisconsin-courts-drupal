global-styling:

  css:
    base:
      "https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@400;500;600;700&display=swap":
        type: external
        minified: true

      assets/css/base/styles.css: { weight: -1 }
      assets/css/base/variables.css: {}
      assets/css/base/elements.css: {}

    theme:
      css/homepage-layout.css: {}
      css/news-story.css: {}
      css/news-listing.css: {}
      css/opinions-listing.css: {}

  js:
    assets/uswds/js/uswds.min.js: {}

  dependencies:
    - core/drupal
    - wisconsin_courts/uswds-init

# USWDS requires its small initializer before the page body is rendered.
uswds-init:
  header: true
  js:
    assets/uswds/js/uswds-init.min.js: { minified: true }
