name: 'Latest News'
description: 'Homepage news and opinions card with filtering tabs.'
group: 'Wisconsin Courts'

props:
  type: object
  properties:

    heading:
      title: 'Heading'
      type: string

    default_tab:
      title: 'Default tab'
      type: string
      enum:
        - news
        - opinions
        - both
      default: news

    all_news_text:
      title: 'View all link text'
      type: string

    all_news_url:
      title: 'View all link URL'
      $ref: 'ui-patterns://url'

    items:
      title: 'News and opinion items'
      type: array
      items:
        type: object
        properties:
          type:
            title: 'Content type'
            type: string
            enum:
              - news
              - opinion

          title:
            title: 'Title'
            type: string

          date:
            title: 'Publication date'
            type: string

          summary:
            title: 'Summary'
            type: string

          url:
            title: 'URL'
            $ref: 'ui-patterns://url'

          image:
            title: 'Image URL'
            $ref: 'ui-patterns://url'

          image_alt:
            title: 'Image alt text'
            type: string

          case_number:
            title: 'Case number'
            type: string

          label:
            title: 'Label'
            type: string