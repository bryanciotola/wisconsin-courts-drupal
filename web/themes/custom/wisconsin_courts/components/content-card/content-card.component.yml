name: 'Content Card'
description: 'A Wisconsin Courts card with optional body text, image, list, and call-to-action button.'
group: 'Wisconsin Courts'

props:
  type: object
  properties:

    card_title:
      title: 'Card title'
      type: string

    body:
      title: 'Body text'
      type: string

    image_url:
      title: 'Image'
      $ref: 'ui-patterns://url'

    image_position:
      title: 'Image position'
      type: string
      enum:
        - left
        - right

    image_shape:
      title: 'Image shape'
      type: string
      enum:
        - rectangle
        - square
        - circle

    image_size:
      title: 'Image size'
      type: string
      enum:
        - small
        - medium
        - large
        - extra-large

    image_fit:
      title: 'Image fit'
      type: string
      enum:
        - cover
        - contain

    image_focus:
      title: 'Image focus'
      type: string
      enum:
        - top
        - center
        - bottom
        - left
        - right

    list_type:
      title: 'List type'
      type: string
      enum:
        - none
        - plain
        - links

    item_1_text:
      title: 'Item 1 text'
      type: string

    item_1_url:
      title: 'Item 1 URL'
      $ref: 'ui-patterns://url'

    item_2_text:
      title: 'Item 2 text'
      type: string

    item_2_url:
      title: 'Item 2 URL'
      $ref: 'ui-patterns://url'

    item_3_text:
      title: 'Item 3 text'
      type: string

    item_3_url:
      title: 'Item 3 URL'
      $ref: 'ui-patterns://url'

    item_4_text:
      title: 'Item 4 text'
      type: string

    item_4_url:
      title: 'Item 4 URL'
      $ref: 'ui-patterns://url'

    item_5_text:
      title: 'Item 5 text'
      type: string

    item_5_url:
      title: 'Item 5 URL'
      $ref: 'ui-patterns://url'

    button_text:
      title: 'Button text'
      description: 'Text displayed inside the button.'
      type: string

    button_url:
      title: 'Button URL'
      description: 'Destination for the button.'
      $ref: 'ui-patterns://url'

    button_variant:
      title: 'Button style'
      description: 'Official USWDS button style.'
      type: string
      enum:
        - default
        - secondary
        - accent-cool
        - accent-warm
        - base
        - outline
        - inverse
        - unstyled

    button_size:
      title: 'Button size'
      description: 'Official USWDS button sizing.'
      type: string
      enum:
        - default
        - big

libraryOverrides:
  css: {}